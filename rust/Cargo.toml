[package]
name = "dev-session-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Persistent Rust stdio development MCP for Secure MCP Tunnel"
default-run = "dev-session-mcp"

[dependencies]
axum = "0.8"
rmcp = { version = "=3.5.1", features = ["transport-streamable-http-server", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
url = "2"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
codex-protocol = { git = "https://github.com/openai/codex", rev = "20fedafff83f5c681fc62f73b0ca3227e42e3f8b" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "20fedafff83f5c681fc62f73b0ca3227e42e3f8b" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "time", "signal", "sync"] }
pty-process = { version = "=0.5.3", features = ["async"] }
strip-ansi-escapes = "=0.2.1"
uuid = { version = "1", features = ["v4"] }
# starlark 0.13 uses hashbrown 0.14. allocative 0.3.5+ moved its
# hashbrown integration to a newer, type-incompatible release.
allocative = "=0.3.4"
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
codex-sandboxing = { git = "https://github.com/openai/codex", rev = "20fedafff83f5c681fc62f73b0ca3227e42e3f8b" }

[target.'cfg(target_os = "linux")'.dependencies]
codex-linux-sandbox = { git = "https://github.com/openai/codex", rev = "20fedafff83f5c681fc62f73b0ca3227e42e3f8b" }

[profile.release]
strip = true

[dev-dependencies]
# Test clients and ephemeral OAuth fixtures only; no Node runtime/test runner.
rmcp = { version = "=3.5.1", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
test-http = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "query"] }
rsa = "0.9"
rand = "0.8"
sha2 = "0.10"
tempfile = "3"
